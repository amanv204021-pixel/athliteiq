databases:
  - name: athliteiq-db
    databaseName: athliteiq
    user: athliteiq
    plan: free

services:
  - type: web
    name: athliteiq
    runtime: python
    plan: free
    autoDeployTrigger: off
    buildCommand: >-
      pip install -r requirements.txt &&
      python scripts/download_model.py &&
      cd frontend &&
      npm ci &&
      cd .. &&
      bash scripts/setup_live.sh &&
      cd frontend &&
      npm run build
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: athliteiq-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /tmp/athliteiq-uploads
      - key: MAX_UPLOAD_MB
        value: 80
